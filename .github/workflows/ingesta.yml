# Disparo MANUAL de la ingesta de 10-Swaper.
#
# **La ingesta programada NO vive acá.** Vive en la base, con pg_cron: ver
# `supabase/migrations/20260827210000_cron_ingesta.sql`.
#
# Por qué se movió: este workflow tuvo los tres crons declarados el 26/08/2026 y el 27/08 no
# disparó **ninguna** de las ~20 veces que le tocaba, con el workflow activo, Actions habilitado y
# el disparo manual funcionando. Los schedules de GitHub son best-effort y se saltean sin avisar;
# para algo que tiene que correr todos los días de rueda no alcanza. pg_cron corre dentro del
# Postgres que ya está siempre encendido.
#
# Esto queda como la puerta de emergencia: disparar una corrida a mano desde la pestaña Actions,
# sin abrir una terminal ni tener el secreto a mano. Le pega a los mismos endpoints que el cron.

name: Ingesta de mercado (manual)

on:
  workflow_dispatch:
    inputs:
      corrida:
        description: 'Qué corrida disparar'
        required: true
        default: refresh
        type: choice
        options: [matinal, refresh]

# El backend toma un advisory lock, así que un disparo manual que caiga sobre una corrida del cron
# se omite en vez de duplicarse. Igual se serializa acá para no encolar trabajo inútil.
concurrency:
  group: ingesta
  cancel-in-progress: false

jobs:
  disparar:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar la corrida
        env:
          BASE: ${{ vars.SWAPER_BASE_URL || 'https://swaper-snowy.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::Falta el secret CRON_SECRET. Cargalo en Settings > Secrets and variables > Actions."
            exit 1
          fi
          # --fail-with-body: un 4xx/5xx corta el job pero deja ver el cuerpo, que es donde el
          # backend explica el motivo. --max-time cubre la matinal completa (el backend corta
          # antes por su propio maxDuration).
          curl --fail-with-body --silent --show-error --max-time 300 \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${BASE}/api/v1/jobs/cron/${{ inputs.corrida }}" \
            | tee respuesta.json
          echo
          # Una corrida omitida (fuera de rueda, o con otra en curso) responde 200 y no es un fallo.
          if grep -q '"omitida": *true' respuesta.json; then
            echo "::notice::Corrida omitida por el backend (ver motivo en la respuesta)."
          fi
